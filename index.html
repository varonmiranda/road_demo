<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hospital Salting Advisor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data/basemap.js"></script>
<script>
  // mode lives in the #hash (the only URL state a shared link keeps); ?mode= still works locally
  const MODE = (location.hash === "#live" || new URLSearchParams(location.search).get("mode") === "live") ? "live" : "replay";
  // STATIC = no demo server behind the page (a shared link): no refresh, no cache-busting
  const STATIC = !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  addEventListener("hashchange", () => location.reload());
  document.write(MODE === "live"
    ? '<script src="data/live.js' + (STATIC ? "" : "?v=" + Date.now()) + '"><\/script>'
    : '<script src="data/replay.js"><\/script>');
</script>
<style>
/* Map-first decision product: the city fills the screen, one frosted card answers act / where / when / what.
   Everything analytical lives in a slide-out Details panel. One dark winter world. */
:root{
  color-scheme: dark;
  --bg:#060b12; --map:#0a121c; --glass:rgba(12,20,31,.72); --glass-2:rgba(16,26,40,.86); --solid:#0d1622;
  --ink:#edf4fb; --ink-2:#a9b9cb; --muted:#6e8197; --line:rgba(150,195,240,.11); --line-2:rgba(150,195,240,.22);
  --ice:#8fd0ff; --red:#ff5252; --amber:#ffb224; --blue:#4fa3ff; --neutral:#2c3b4e; --planned:#3fdc95;
  --state:var(--ice);
  --bm-land:#0b131e; --bm-water:#0e2135; --bm-road:#152030; --bm-edge:#22324a;
  --brine:#2bc4bd; --prewet:#4f8ff7; --blend:#a27df0; --dry:#e3913e; --none:#2c3a4b; --warn:#ffb224; --bad:#ff7a6e; --crit:#ff5252;
  --cold:#4fa3ff; --good:#3fdc95; --accent:#8fd0ff; --air:#6e8197; --grade:#8fd0ff; --bridge:#ff7a6e; --snow:#24496b;
  --f-ui:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif; --f-num:"Space Grotesk","Inter",-apple-system,sans-serif;
}
:root[data-state="deploy"]{--state:var(--red)} :root[data-state="prepare"]{--state:var(--amber)}
:root[data-state="monitor"]{--state:var(--blue)} :root[data-state="clear"]{--state:var(--ice)} :root[data-state="planned"]{--state:var(--planned)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
body{color:var(--ink);font:14px/1.5 var(--f-ui);font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px;border-radius:8px}
.glass{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(20px) saturate(140%);backdrop-filter:blur(20px) saturate(140%);box-shadow:0 24px 60px rgba(0,0,0,.45)}

/* the map is the product */
#map{position:fixed;inset:0;background:var(--map)}
#mapSnow{position:fixed;inset:0;z-index:400;pointer-events:none;width:100%;height:100%}
.vignette{position:fixed;inset:0;z-index:401;pointer-events:none;background:
  linear-gradient(180deg,rgba(6,11,18,.85),rgba(6,11,18,0) 120px),
  radial-gradient(120% 90% at 50% 50%,transparent 55%,rgba(3,6,10,.6))}

/* top bar floats over the map */
.top{position:fixed;z-index:600;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 0}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line-2);background:rgba(143,208,255,.10)}
.mark svg{width:16px;height:16px;color:var(--ice)}
.brand b{font:600 14px var(--f-ui);white-space:nowrap}
.seg{display:inline-flex;padding:3px;border-radius:11px}
.seg a{font:500 12.5px var(--f-ui);padding:6px 12px;border-radius:8px;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.seg a.on{background:rgba(143,208,255,.16);color:var(--ink)}
.btn-top{border:1px solid var(--line-2);border-radius:10px;padding:7px 12px;font:500 12.5px var(--f-ui);cursor:pointer;background:var(--glass);color:var(--ink);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.btn-top:hover{border-color:var(--ice)}

/* the decision card */
.card{position:fixed;z-index:600;left:18px;top:calc(70px + env(safe-area-inset-top,0px));width:360px;border-radius:20px;padding:20px 20px 16px;
  border-color:color-mix(in srgb,var(--state) 38%,var(--line));transition:border-color .6s}
.card::before{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;
  background:radial-gradient(120% 70% at 0% 0%,color-mix(in srgb,var(--state) 16%,transparent),transparent 60%);transition:background .6s}
.chip{position:relative;display:inline-flex;align-items:center;gap:8px;font:600 10.5px var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--state);transition:color .6s}
.led{width:8px;height:8px;border-radius:50%;background:var(--state);box-shadow:0 0 10px var(--state)}
:root[data-state="deploy"] .led,:root[data-state="prepare"] .led{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.verb{position:relative;margin:12px 0 6px;font:700 32px/1.02 var(--f-num);letter-spacing:.01em;text-transform:uppercase;color:var(--ink)}
.when{position:relative;font-size:15px;color:var(--ink-2)}
.when b{font:600 17px var(--f-num);color:var(--state);transition:color .6s}
.what{position:relative;margin:14px 0 16px;font:500 15px var(--f-num);color:var(--ink);letter-spacing:.01em}
.what span{color:var(--muted);margin:0 7px}
.cta{position:relative;width:100%;padding:14px 16px;border:0;border-radius:12px;cursor:pointer;font:700 14px var(--f-num);letter-spacing:.06em;
  background:var(--state);color:#04101c;box-shadow:0 10px 30px color-mix(in srgb,var(--state) 38%,transparent);transition:background .6s, box-shadow .6s, filter .2s}
.cta:hover{filter:brightness(1.07)}
.cta.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line-2);box-shadow:none}
.why{position:relative;margin:14px 0 0;font-size:13px;line-height:1.5;color:var(--ink-2)}
.more{position:relative;margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.more button{background:none;border:0;padding:0;color:var(--ice);font:600 12.5px var(--f-ui);cursor:pointer}
.cardnote{position:relative;display:block;margin-top:6px;font-size:11px;color:var(--muted)}
.cardnote:empty{display:none}
.card .body > *{transition:opacity .35s, transform .35s}
.card.thinking .body > *{opacity:0;transform:translateY(6px)}
.thinkline{position:relative;display:none;margin-top:14px;height:2px;border-radius:2px;overflow:hidden;background:var(--line)}
.card.thinking .thinkline{display:block}
.thinkline::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,var(--ice),transparent);animation:sweep 1s linear infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.reveal .verb,.reveal .when,.reveal .what,.reveal .cta,.reveal .why{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.reveal .when{animation-delay:.05s}.reveal .what{animation-delay:.1s}.reveal .cta{animation-delay:.16s}.reveal .why{animation-delay:.22s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

/* time pill + legend */
.timepill{position:fixed;z-index:600;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;
  padding:8px 14px 8px 8px;border-radius:999px;width:min(560px,calc(100% - 36px))}
.play{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line-2);background:transparent;cursor:pointer;font-size:11px;display:grid;place-items:center}
.timepill input{flex:1;min-width:0;accent-color:var(--state)}
.timepill b{flex:none;font:500 12.5px var(--f-num);white-space:nowrap}
.legend{position:fixed;z-index:600;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:14px;font-size:11.5px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:16px;height:3px;border-radius:2px}
.leaflet-container{background:var(--map);font-family:var(--f-ui)}
.leaflet-control-zoom{margin-right:18px!important;margin-bottom:150px!important;border:0!important}
.leaflet-control-zoom a{background:var(--glass-2)!important;color:var(--ink)!important;border:1px solid var(--line-2)!important}
.leaflet-control-attribution{background:transparent!important;color:var(--muted)!important;font-size:9.5px!important}
.leaflet-control-attribution a{color:var(--ink-2)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip,.leaflet-tooltip{background:var(--solid);color:var(--ink);border:1px solid var(--line-2);box-shadow:0 12px 30px rgba(0,0,0,.45)}
.leaflet-popup-content{font-size:12px;line-height:1.45;margin:11px 13px}
.leaflet-popup-content table{margin-top:4px;font-size:11.5px} .leaflet-popup-content td{padding:1px 4px}
.leaflet-tooltip.hl{background:transparent;border:0;box-shadow:none;color:var(--ink-2);font:600 10px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;padding:0;text-shadow:0 1px 3px #000}
.leaflet-tooltip.hl::before{display:none}
.halo{animation:halo 2.4s ease-in-out infinite}
@keyframes halo{50%{opacity:.25}}
path.route{stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(63,220,149,.85))}

/* details: everything secondary */
.drawer{position:fixed;z-index:700;top:0;right:0;bottom:0;width:min(440px,100%);overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));
  border-radius:20px 0 0 20px;transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.drawer.open{transform:none}
.dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.dhead h2{margin:0;font:600 15px var(--f-ui)}
.x{width:32px;height:32px;border-radius:10px;border:1px solid var(--line-2);background:transparent;cursor:pointer}
.sec{padding:16px 0;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0}
.sec h3{margin:0 0 10px;font:600 10.5px var(--f-ui);letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.sec p{margin:6px 0;font-size:13px;color:var(--ink-2)}
.sec p b,.sec li b{color:var(--ink)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.list li{display:grid;grid-template-columns:16px 1fr;gap:8px;font-size:13px;color:var(--ink-2)}
.list li::before{content:"✓";color:var(--state)}
.facts{display:grid;gap:8px}
.fact{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--line);padding-bottom:7px}
.fact b{font:600 13.5px var(--f-num);color:var(--ink);text-align:right}
.fact[data-hot="1"] b{color:var(--state)}
#tl{display:block;width:100%;height:156px;overflow:visible}
#chart{width:100%;height:140px;display:block}
#chart text{fill:var(--muted);font-size:10px;font-family:var(--f-ui)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select.s{background:var(--solid);border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;font-size:12.5px;max-width:100%}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
th,td{text-align:left;padding:6px 5px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:11px}
td.n{text-align:right;font-family:var(--f-num);white-space:nowrap}
.note{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kv .v{font:600 18px var(--f-num)} .kv .l{font-size:11.5px;color:var(--muted)}
.btn-s{background:transparent;border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.drill{margin-top:8px;padding:8px 12px;border-radius:10px;font-size:12.5px;border:1px solid var(--amber);background:rgba(255,178,36,.10)}
a{color:var(--ice)}
.sw2{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}

/* phone: card becomes a bottom sheet, legend tucks away */
@media (max-width:700px){
  .brand b{display:none}
  .card{left:12px;right:12px;width:auto;top:auto;bottom:calc(72px + env(safe-area-inset-bottom,0px));padding:16px}
  .verb{font-size:26px}
  .legend{display:none}
  .timepill{bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px)}
  .leaflet-control-zoom{display:none}
  .drawer{border-radius:0}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div id="map"></div>
<div class="vignette" aria-hidden="true"></div>

<header class="top">
  <div class="brand">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 1.5v13M2.4 4.75l11.2 6.5M13.6 4.75 2.4 11.25M8 1.5 6.6 3M8 1.5 9.4 3M8 14.5 6.6 13M8 14.5l1.4-1.5"/></svg></div>
    <b>Hospital Salting Advisor</b>
  </div>
  <nav class="seg glass" aria-label="Data source"><a href="#replay" id="mReplay">Jan 2025 storm</a><a href="#live" id="mLive">Live forecast</a></nav>
  <button class="btn-top" id="openDetails">Details</button>
</header>

<section class="card glass" id="card" aria-live="polite">
  <div class="chip"><span class="led"></span><span id="chip">Analyzing</span></div>
  <div class="thinkline"></div>
  <div class="body">
    <div class="verb" id="verb">—</div>
    <div class="when" id="when"></div>
    <div class="what" id="what"></div>
    <button class="cta" id="cta">Approve plan</button>
    <p class="why" id="why"></p>
    <div class="more"><button id="seeWhy">See why and details →</button></div>
    <small class="cardnote" id="cardNote"></small>
  </div>
</section>

<div class="timepill glass">
  <button class="play" id="play" aria-label="Play through the forecast">▶</button>
  <input type="range" id="slider" min="0" value="0" aria-label="Decision time">
  <b id="now"></b>
</div>
<div class="legend glass" id="legend"></div>

<aside class="drawer glass" id="drawer" aria-label="Details">
  <div class="dhead"><h2>Details</h2><button class="x" id="closeDetails" aria-label="Close details">✕</button></div>
  <div id="source" class="note"></div>
  <div class="sec"><h3>Why this decision</h3><p id="engOut"></p><ul class="list" id="whyList"></ul></div>
  <div class="sec"><h3>Timeline · next 24 h</h3><svg id="tl" role="img" aria-label="Decision timeline"></svg><p id="tlq" class="note"></p></div>
  <div class="sec"><h3>Deciding factors</h3><div class="facts" id="factors"></div></div>
  <div class="sec"><h3>Where</h3><p id="whereTxt"></p><div class="row"><label class="note" for="layer">Map layer</label>
    <select class="s" id="layer"><option value="status">Operational status</option><option value="risk">Freeze risk if untreated</option><option value="advisor">Advisor actions this hour</option><option value="blanket">Blanket practice this hour</option><option value="saved">Salt saved so far</option><option value="cold">Cold spots (Earth Engine)</option><option value="tier">Priority tiers</option></select></div></div>
  <div class="sec"><h3>Forecast</h3><svg id="chart" preserveAspectRatio="none" role="img" aria-label="Forecast temperatures and snowfall"></svg><p class="note" id="cond"></p></div>
  <div class="sec"><h3>Full 24-hour plan</h3><div class="row"><select class="s" id="issue" aria-label="Plan window"></select><select class="s" id="hosp" aria-label="Hospital"></select></div>
    <div id="callouts"></div><div class="tablewrap"><table id="plantbl"><thead><tr><th>When</th><th>Action</th><th>Material</th><th class="n">Lane-mi</th><th class="n">lb/ln-mi</th><th class="n">Tons</th></tr></thead><tbody></tbody></table></div></div>
  <div class="sec"><h3>Impact vs blanket practice</h3><div class="kv" id="impact"></div><p class="note" id="sens"></p></div>
  <div class="sec"><h3>Model inputs</h3><div id="method"></div></div>
</aside>

<script>
const D = MODE === "live" ? window.LIVE : window.REPLAY;
const LIVE = MODE === "live" ? D && D.live : null;
if (!D) document.body.innerHTML = `<p style="padding:24px;color:#e9f2fb">No live forecast yet. Start the demo with <code>python3 serve.py</code> and click Refresh, or run <code>python3 live_plan.py</code>.</p>`;
const H = D.hours.length, SEG = D.segments;
const HOSP = Object.fromEntries(D.hospitals.map(h => [h.id, h]));
const SHORT = {mwhc:"Washington Hospital Center",cnh:"Children's National",gwu:"GW Hospital",hu:"Howard University",mgu:"Georgetown",sib:"Sibley Memorial",va:"DC VA Medical Center",chr:"Cedar Hill"};
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const mix = (a,b,k) => { const p=h=>[1,3,5].map(j=>parseInt(h.slice(j,j+2),16)); const A=p(a),B=p(b);
  return "#"+A.map((v,j)=>Math.round(v+(B[j]-v)*k).toString(16).padStart(2,"0")).join(""); };
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const hr = i => new Date(D.hours[Math.min(i,H-1)]);
const fmtT = i => hr(i).toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric",hour:"numeric"});
const fmtH = i => i >= H ? "end of forecast" : hr(i).toLocaleString("en-US",{hour:"numeric",minute:"2-digit"});
const fmtDH = i => i >= H ? "end of forecast" : hr(i).toLocaleString("en-US",{weekday:"short",hour:"numeric",minute:"2-digit"});
const fmtS = i => hr(i).toLocaleString("en-US",{hour:"numeric"}).replace(" ","").toLowerCase();
const BRIDGE_MIN = D.hours.map((_,tt)=>Math.min(...SEG.filter(s=>s.bridge).map(s=>D.seg_pavement[s.id][tt]/10)));
const TOTAL_LM = SEG.reduce((a,s)=>a+s.lane_mi,0);
// Truck estimate (the model plans by 3-h route cycle, not by vehicle): ~30 lane-mi per truck per pass, 8 t usable load
const LM_PER_TRUCK = 30, TRUCK_LOAD_T = 8;
document.getElementById(MODE === "live" ? "mLive" : "mReplay").classList.add("on");

// ---------- per-strategy indexes (unchanged model output)
const EV = {};
for (const st of ["advisor","blanket"]) {
  const byT = Array.from({length:H}, () => []), cum = SEG.map(() => new Float32Array(H));
  for (const e of D.strategies[st].events) byT[e[0]].push(e);
  const run = new Float32Array(SEG.length);
  for (let t=0;t<H;t++){ for (const e of byT[t]) run[e[1]] += e[4]; for (let i=0;i<SEG.length;i++) cum[i][t]=run[i]; }
  EV[st] = {byT, cum};
}
const evIndex = {advisor:{}, blanket:{}};
for (const st of ["advisor","blanket"]) for (let tt=0;tt<H;tt++) for (const e of EV[st].byT[tt]) evIndex[st][tt+":"+e[1]] = e;
const lastEventAt = (st,i,tt) => evIndex[st][tt+":"+i] || null;

// ---------- freeze risk if untreated (weather + segment exposure only)
const wetUntil = []; { let last=-99; D.weather.forEach((w,t)=>{ if(w.precip>0) last=t; wetUntil[t]= t-last < 8; }); }
const pav = (s,t) => D.seg_pavement[s.id][t] / 10;
function untreatedRisk(s,t){
  if (s.tunnel) return 0;
  const T = pav(s,t), w = D.weather[t];
  if (T > 33) return 0;
  if (!wetUntil[t]) return (w.dew >= T || (s.frost_prone && w.dew >= T - 2)) ? 1 : 0;
  let r = T >= 28 ? 2 : 3;
  if ((s.bridge || s.grade >= 6) && r < 3) r++;
  return r;
}
const band = T => T>32 ? {k:"Not needed", s:"pavement above freezing"} : T>=25 ? {k:"Optimal", s:"rock salt works well (25–32°F)"}
  : T>=20 ? {k:"Reduced", s:"rock salt slows (20–25°F)"} : T>=15 ? {k:"Weak", s:"needs CaCl₂ pre-wet (15–20°F)"} : {k:"Ineffective", s:"rock salt barely works below 15°F"};

// =====================================================================================
// DECISION LAYER — reads the model's plan and forecast at decision time t; adds no new physics
// =====================================================================================
function decide(t){
  const end24 = Math.min(H, t+24), end12 = Math.min(H, t+12);
  let ft = null;
  for (let tt=t; tt<end24 && ft===null; tt++) if (EV.advisor.byT[tt].some(e=>e[4]>0)) ft = tt;
  const d = {t, ft, pass:null};
  if (ft !== null) {
    const pe = []; for (let tt=ft; tt<Math.min(H, ft+D.route_cycle_h); tt++) EV.advisor.byT[tt].forEach(e=>{ if(e[4]>0) pe.push(e); });
    const segs = new Map(); let lb=0, lbB=0, rmin=1e9, rmax=0, fmin=99, last=ft; const mat={}, act={}, hosp={};
    pe.forEach(e=>{ const s=SEG[e[1]]; segs.set(s.id,s); const w=e[4]*s.lane_mi; lb+=w; rmin=Math.min(rmin,e[4]); rmax=Math.max(rmax,e[4]); fmin=Math.min(fmin,e[5]); last=Math.max(last,e[0]);
      const m=D.materials[e[3]], a=D.actions[e[2]]; mat[m]=(mat[m]||0)+w; act[a]=(act[a]||0)+w; hosp[s.hosp]=(hosp[s.hosp]||0)+s.lane_mi; });
    for (let tt=ft; tt<Math.min(H, ft+D.route_cycle_h); tt++) EV.blanket.byT[tt].forEach(e=>{ lbB+=e[4]*SEG[e[1]].lane_mi; });
    const lm=[...segs.values()].reduce((a,s)=>a+s.lane_mi,0), tons=lb/2000;
    const top = o => Object.entries(o).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
    const ordered = pe.slice().sort((a,b)=>a[0]-b[0] || SEG[b[1]].priority-SEG[a[1]].priority);
    const roads=[]; ordered.forEach(e=>{ const s=SEG[e[1]]; const n=s.name==="(unnamed)"?null:s.name.replace(/ (Northwest|Northeast|Southeast|Southwest)$/,m=>({" Northwest":" NW"," Northeast":" NE"," Southeast":" SE"," Southwest":" SW"})[m]).replace(/ Avenue\b/," Ave").replace(/ Street\b/," St"); if(n && !roads.some(r=>r.n===n) && roads.length<3) roads.push({n, bridge:s.bridge}); });
    d.pass = {events:pe, ordered, segs:[...segs.values()], lm, tons, tonsBlanket:lbB/2000, rmin, rmax, fmin, start:ft, end:last+1,

  let onset=null; for (let tt=t; tt<end24; tt++) if (D.weather[tt].precip>0){ onset=tt; break; }

const acting = s => s==="deploy" || s==="prepare";
const hNames = arr => arr.slice(0,3).map(id=>SHORT[id]||HOSP[id].name);

// ---------- the four answers, in plain words
function dayPart(i){   // "tonight", "this afternoon", "tomorrow morning"… relative to decision time
  const a = hr(t), b = hr(i), h = b.getHours();
  const sameDay = a.toDateString() === b.toDateString(), nextDay = (b - new Date(a.toDateString())) / 864e5 < 2 && !sameDay;
  if (h >= 17 || (h < 5 && (sameDay || nextDay) && (b - a) < 12*36e5)) return "tonight";
  const part = h < 12 ? "morning" : "afternoon";
  return sameDay ? `this ${part}` : nextDay ? `tomorrow ${part}` : b.toLocaleString("en-US",{weekday:"long"}) + " " + part;
}
function verb(d){
  if (d.state==="deploy") return "Treat now";
  if (d.state==="prepare") return `Treat ${dayPart(d.pass.start)}`;
  if (d.state==="monitor") return d.pass ? `Stand by` : "Watch roads";
  return "No treatment needed";
}
function shortWhy(d){
  const p = d.pass;
  if (!p) return d.state==="clear" ? `Pavement stays above freezing for the next 24 hours; the coldest hospital road holds at ${Math.round(d.minAll)}°F.`
    : `The coldest road dips to ${Math.round(d.minAll)}°F ${fmtDH(d.minAllT)}, but it stays dry, so there is nothing to freeze yet.`;
  if (d.state==="monitor") return `The next treatment window opens ${fmtDH(p.start)}. Nothing needs salt before then.`;
  if (p.action.startsWith("Anti-ice")) return d.onset!==null ? `Snow starts ${fmtH(d.onset)}. Brine laid 1–4 hours ahead stays on the road; brine laid earlier wears off under traffic.` : `Brine now prevents ice from bonding before conditions turn.`;
  if (p.action.startsWith("Frost")) return `The dew point meets the coldest pavement ${fmtH(p.start)}, so black ice can form on dry bridges. Only those need brine.`;
  if (p.action.startsWith("Refreeze")) return `Wet roads drop to ${Math.round(p.fmin)}°F. Only the spots without enough leftover salt need a top-up.`;
  if (d.nowSnow>0) return `Snow is falling on ${Math.round(D.pavement_median[t])}°F pavement. Plow, then top up salt sized for the ${Math.round(p.fmin)}°F low${p.tonsBlanket>p.tons?`, ${Math.round(100*(1-p.tons/p.tonsBlanket))}% less than a fixed-rate pass`:""}.`;
  return `Pavement falls to ${Math.round(p.fmin)}°F. Salt is sized for that low and counts what is already on the road.`;
}
function engineOut(d){
  const p=d.pass;
  if (d.state==="deploy") return `<b>Deploy now.</b> ${p.action.startsWith("Anti-ice")?"Anti-ice":p.action.startsWith("Frost")?"Frost brine":"Plow and treat"} ${p.lm.toFixed(0)} lane-miles.`;
  if (d.state==="prepare") return `<b>Deploy at ${fmtH(p.start)}, not now.</b>`;
  if (d.state==="monitor") return p ? `<b>Hold until ${fmtDH(p.start)}.</b>` : `<b>Hold.</b> Watch the coldest roads.`;
  return `<b>Hold all trucks.</b> No ice risk in 24 hours.`;
}
function whyList(d){
  const p = d.pass, li=[];
  if (p) {
    li.push(`<b>Timing.</b> Start ${fmtDH(p.start)}, done by ${fmtH(p.end)}. ${d.onset!==null && p.start<d.onset ? `Finishes ${d.onset-p.end>=1?`${d.onset-p.end} h`:"just"} before snow starts.` : p.action.startsWith("Frost") ? "That is when the dew point reaches the coldest surfaces." : "Follows the plow cycle, so salt lands on cleared pavement."}`);
    li.push(`<b>Scope.</b> ${p.lm.toFixed(0)} of ${TOTAL_LM.toFixed(0)} lane-miles${p.bridges?`, ${p.bridges} bridge segments`:""}. Bridges, steep grades and the last block to each ER go first.`);
    li.push(`<b>Material.</b> ${esc(p.material)} at ${p.rmin===p.rmax?p.rmax:`${p.rmin}–${p.rmax}`} lb/lane-mile, the Minnesota band for ${band(p.fmin).s.replace(/^.*\(/,"").replace(")","")} pavement.`);
    if (p.tonsBlanket>0) li.push(`<b>Savings.</b> ${p.tons.toFixed(1)} t vs ${p.tonsBlanket.toFixed(1)} t for blanket practice in the same hours (${Math.round(100*(1-p.tons/p.tonsBlanket))}% less), same trucks.`);
    li.push(`<b>Resources.</b> ${p.trucks} trucks is an estimate (lane-miles ÷ ${LM_PER_TRUCK} or tons ÷ ${TRUCK_LOAD_T}); the model plans by 3-hour route cycle.`);
  } else {
    li.push(`<b>Temperature.</b> Coldest corridor road ${Math.round(d.minAll)}°F ${fmtDH(d.minAllT)}. Salt only matters at 32°F or below.`);
    li.push(`<b>Moisture.</b> ${d.onset!==null ? `Precipitation starts ${fmtDH(d.onset)}.` : `None forecast in 24 h${LIVE?` (max ${Math.round(d.pop)}% chance)`:""}.`}`);
  }
  li.push(`<b>Source.</b> ${LIVE ? `NWS forecast${LIVE.drill_f?` shifted ${LIVE.drill_f}°F colder (drill)`:""}` : "Recorded Jan 5–7, 2025 storm weather"} → per-road pavement model → Minnesota salt rules. Road temperatures are modeled, not measured.`);
  return li;
}
function factors(d){
  const tNow=D.pavement_median[d.t], tNext=D.pavement_median[Math.min(H-1,d.t+3)];
  const arrow = tNext<tNow-0.5 ? " ↓" : tNext>tNow+0.5 ? " ↑" : "";

    ["Typical road temperature", `${Math.round(tNow)}°F${arrow}`, d.minMed<=32],
    ["Low in next 24 h", `${Math.round(d.minMed)}°F, ${fmtDH(d.minMedT)}`, d.minMed<=32],

// ---------- timeline (drawer): why act at this exact time
const measureCtx = document.createElement("canvas").getContext("2d");
function drawTimeline(d){
  const svg = document.getElementById("tl"), W = svg.clientWidth;
  if (W < 200 || !d) return;
  const Hh = 156, padL = 6, padR = 6, y0 = 62, end = Math.min(H-1, t+24);
  svg.setAttribute("viewBox", `0 0 ${W} ${Hh}`);
  const X = i => padL + (W-padL-padR) * (i - t) / Math.max(1, end - t);
  let g = "";
  const temps = []; for (let i=t;i<=end;i++) temps.push(D.pavement_median[i]);
  const lo = Math.min(...temps, 28), hi = Math.max(...temps, 36), Ty = v => 12 + 32 * (1 - (v-lo)/(hi-lo));
  if (32>=lo && 32<=hi) g += `<line x1="${padL}" x2="${W-padR}" y1="${Ty(32)}" y2="${Ty(32)}" stroke="${css("--ice")}" stroke-opacity=".35" stroke-dasharray="2 4"/><text x="${W-padR}" y="${Ty(32)-3}" text-anchor="end" font-size="9.5" fill="${css("--muted")}">32°F</text>`;
  g += `<polyline fill="none" stroke="${css("--ice")}" stroke-opacity=".75" stroke-width="1.5" points="${temps.map((v,k)=>`${X(t+k)},${Ty(v)}`).join(" ")}"/>`;
  g += `<text x="${padL}" y="9" font-size="9.5" fill="${css("--muted")}">typical road temperature</text>`;
  for (let i=t;i<end;i++) if (D.weather[i].precip>0) g += `<rect x="${X(i)}" y="${y0-4}" width="${Math.max(1.5,X(i+1)-X(i))}" height="8" fill="${css("--blue")}" fill-opacity="${Math.min(0.85,0.3+D.weather[i].snow*1.3)}"/>`;
  g += `<line x1="${padL}" x2="${W-padR}" y1="${y0}" y2="${y0}" stroke="${css("--line-2")}" stroke-width="1.5"/>`;
  const p = d.pass;
  if (p) { const a = X(p.start), b = X(Math.min(end, p.end));
    g += `<rect x="${a}" y="${y0-11}" width="${Math.max(6,b-a)}" height="22" rx="5" fill="${css("--state")}" fill-opacity=".18" stroke="${css("--state")}" stroke-width="1.2"/>`; }
  for (let i=t;i<=end;i++) if ((i-t)%6===0) g += `<text x="${X(i)}" y="${y0+24}" text-anchor="middle" font-size="10" fill="${css("--muted")}">${fmtS(i)}</text>`;
  const pins = [{i:t, l:"Now", c:"--ink"}];
  if (d.onset!==null && d.onset>t) pins.push({i:d.onset, l:d.snow12>0||D.weather[d.onset].snow>0?"Snow begins":"Precipitation", c:"--blue"});
  if (d.hit32!==null && d.hit32>t) pins.push({i:d.hit32, l:"Road hits 32°F", c:"--ice"});

  if (d.freeze!==null && d.freeze>t) pins.push({i:d.freeze, l:d.frostOnly?"Frost risk":"Freeze risk", c:"--red"});
  if (d.minB<15 && d.minBT>t) pins.push({i:d.minBT, l:"Bridges < 15°F", c:"--red"});
  pins.sort((a,b)=>a.i-b.i || (b.strong?1:0)-(a.strong?1:0));
  const rows = [-1e9,-1e9,-1e9,-1e9];
  pins.forEach(pn=>{
    const x = X(pn.i), col = css(pn.c);
    measureCtx.font = `${pn.strong?700:500} 11px Inter, -apple-system, sans-serif`;
    const w = measureCtx.measureText(pn.l).width + 14;
    const anchor = x - w/2 < padL ? "start" : x + w/2 > W-padR ? "end" : "middle";

    g += `<line x1="${x}" x2="${x}" y1="${y0+6}" y2="${ly-10}" stroke="${col}" stroke-opacity=".45"/>`;
    g += `<text x="${x}" y="${ly}" text-anchor="${anchor}" font-size="11" font-weight="${pn.strong?700:500}" fill="${pn.strong?col:css("--ink-2")}">${esc(pn.l)}</text>`;
  });
  svg.innerHTML = g;
  document.getElementById("tlq").textContent = p
    ? (acting(d.state) ? `Why ${fmtH(p.start)}? ${d.onset!==null && p.start<d.onset ? "Late enough that traffic won't wear the brine off, early enough to finish before snow." : p.action.startsWith("Frost") ? "That is when the dew point meets the coldest pavement." : "It follows the plow cycle, so salt lands on cleared pavement."}` : `Next treatment window opens ${fmtDH(p.start)}.`)

  statusOf = SEG.map(s=>{
    if (inPass.has(s.id)) return d.state==="deploy" ? 3 : 2;
    if (later.has(s.id)) return 2;
    for (let tt=t; tt<Math.min(H,t+12); tt++){ if (untreatedRisk(s,tt)>=1 || pav(s,tt)<=34) return 1; }
    return 0;
  });
}
const STATUS = [{c:"--neutral", l:"No action"}, {c:"--blue", l:"Watch"}, {c:"--amber", l:"Treat soon"}, {c:"--red", l:"Treat now"}];
const RISK = [{c:"--none", l:"OK"}, {c:"--warn", l:"Frost possible"}, {c:"--bad", l:"Wet, 28–32°F"}, {c:"--crit", l:"Wet below 28°F / bridge / steep"}];
function matColor(m){ if(!m||m==="-") return "--none"; if(m.includes("CaCl2")) return "--blend"; if(m.includes("brine")) return "--brine"; if(m.includes("Prewet")) return "--prewet"; return "--dry"; }
function segStyle(s,i){
  if (layer === "status"){ const st=statusOf[i]??0; return {color:css(STATUS[st].c), weight:[1.6,2.6,3.4,4.2][st], opacity:[.8,.95,1,1][st]}; }
  if (layer === "risk"){ const r=untreatedRisk(s,t); return {color:css(RISK[r].c), weight: r>=2?4:2.5, opacity:1}; }
  if (layer === "cold"){ const c=s.cold_idx, k=Math.min(1,Math.abs(c)/2.5); return {color: c<0 ? mix(css("--none"),css("--cold"),0.2+0.8*k) : mix(css("--none"),css("--dry"),0.2+0.8*k), weight: c<-1?4:2.5, opacity:1}; }
  if (layer === "tier") return {color: css(s.tier===1?"--bad":s.tier===2?"--accent":"--none"), weight: s.tier===1?4:2.5, opacity:1};
  if (layer === "saved"){ const dd=EV.blanket.cum[i][t]-EV.advisor.cum[i][t], k=Math.max(0,Math.min(1,dd/1200)); return {color: dd>0?mix(css("--none"),css("--good"),0.25+0.75*k):css("--none"), weight:3, opacity:1}; }
  const ev = lastEventAt(layer,i,t);
  if (!ev) return {color:css("--none"), weight:2, opacity:.6};
  return {color:css(matColor(D.materials[ev[3]])), weight: ev[4]>0 ? 3+Math.min(4,ev[4]/80) : 2, opacity:1};
}
function paint(){
  lines.forEach((ln,i)=>ln.setStyle(segStyle(SEG[i],i)));
  haloGroup.clearLayers();
  if (layer==="status" && current){
    const hot = SEG.filter((s,i)=>statusOf[i]>=2);
    if (hot.length) L.polyline(hot.map(s=>s.coords), {renderer:haloR, color:css(current.state==="deploy"?"--red":"--amber"), weight:12, opacity:.26, interactive:false}).addTo(haloGroup);
  }
  if (haloR._container) haloR._container.classList.toggle("halo", layer==="status" && !REDUCED);
  legend();
}
function legend(){
  let items;
  if (layer==="status"){
    const present = new Set(statusOf); items = [3,2,1].filter(k=>present.has(k)).map(k=>[STATUS[k].c, STATUS[k].l]);
    if (isPlanned()) items.unshift(["--planned","Approved route"]);
    if (!items.length) items = [["--neutral","No road needs action"]];
  }
  else if (layer==="risk") items = RISK.map(r=>[r.c,r.l]);
  else if (layer==="cold") items = [["--cold","Runs colder"],["--dry","Runs warmer"]];
  else if (layer==="tier") items = [["--bad","Tier 1"],["--accent","Tier 2"],["--none","Tier 3"]];
  else if (layer==="saved") items = [["--good","Salt saved vs blanket"]];
  else items = [["--brine","Brine"],["--prewet","Pre-wetted salt"],["--dry","Dry salt"],["--blend","Salt + CaCl₂"]];
  document.getElementById("legend").innerHTML = items.map(([c,l])=>`<span><i style="background:${css(c)}"></i>${l}</span>`).join("");
}
document.getElementById("layer").onchange = e => { layer = e.target.value; paint(); };
// approved plan: treatment routes draw onto the map in priority order
function drawRoutes(on){
  routeGroup.clearLayers();
  if (!on || !current.pass) return;
  const seen = new Set(), order = current.pass.ordered.filter(e=>!seen.has(e[1]) && seen.add(e[1]));
  order.forEach((e,k)=>{
    const ln = L.polyline(SEG[e[1]].coords, {renderer:routeR, color:css("--planned"), weight:3.2, opacity:1, className:"route", interactive:false}).addTo(routeGroup);
    const path = ln.getElement(); if (!path || REDUCED) return;
    const len = path.getTotalLength(); path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
    path.style.transition = `stroke-dashoffset .7s ease ${Math.min(2.2, k*0.008).toFixed(3)}s`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ path.style.strokeDashoffset = 0; }));
  });
}
function segPopup(s, ll){
  const i=s.id, T=pav(s,t), a=lastEventAt("advisor",i,t), st=STATUS[statusOf[i]??0];
  const fx = e => e ? `${D.actions[e[2]]}${e[4]?` · ${D.materials[e[3]]} @ ${e[4]} lb/lane-mi`:""}` : "none this hour";
  L.popup({maxWidth:300}).setLatLng(ll).setContent(
    `<b>${esc(s.name)}</b>${s.bridge?" · bridge":""}<br><span style="color:${css(st.c)}">● ${st.l}</span> · ${esc(SHORT[s.hosp])}<br>
     Road ${T.toFixed(0)}°F · air ${D.weather[t].air.toFixed(0)}°F<br>${fx(a)}`).openOn(map);
}

// ---------- snow over the map, only while snow is falling at the decision time
const snowRate = () => current ? current.nowSnow : 0;
const DPR = () => Math.min(2, devicePixelRatio||1);
const msnow = document.createElement("canvas"); msnow.id="mapSnow"; document.body.insertBefore(msnow, document.querySelector(".vignette"));
const mctx = msnow.getContext("2d"); let flakes = [], mW = 0, mH = 0;
function sizeSnow(){ mW=innerWidth; mH=innerHeight; msnow.width=mW*DPR(); msnow.height=mH*DPR(); mctx.setTransform(DPR(),0,0,DPR(),0,0);
  flakes = Array.from({length:Math.round(mW*mH/4200)}, () => ({x:Math.random()*mW, y:Math.random()*mH, r:0.6+Math.random()*1.7, v:0.35+Math.random()*0.7, d:Math.random()*6.28})); }
function syncMapSnow(){ msnow.hidden = !(snowRate()>0) || REDUCED; }
function snowFrame(){
  if (!msnow.hidden){
    const rate=Math.min(1,snowRate()*2), n = Math.round(flakes.length*(0.3+0.7*rate));
    mctx.clearRect(0,0,mW,mH); mctx.fillStyle="rgba(235,245,255,0.8)";
    for (let k=0;k<n;k++){ const f=flakes[k]; f.y+=f.v*1.3; f.x+=0.4+Math.sin(f.d+=0.015)*0.35;
      if (f.y>mH){f.y=-4;f.x=Math.random()*mW;} if (f.x>mW) f.x=0; mctx.globalAlpha=0.3+0.45*(f.r/2.3); mctx.beginPath(); mctx.arc(f.x,f.y,f.r,0,6.283); mctx.fill(); }
    mctx.globalAlpha=1;
  }
  requestAnimationFrame(snowFrame);
}

// ---------- drawer analytics (unchanged logic)
const svgC = document.getElementById("chart");
function drawChart(){
  const W = svgC.clientWidth, Hh = 140, padL=30, padR=4, padT=10, padB=18;
  if (W < padL + padR + 40) return;
  svgC.setAttribute("viewBox", `0 0 ${W} ${Hh}`);
  const x = i => padL + (W-padL-padR) * i/(H-1);
  const allT = [...D.weather.map(w=>w.air), ...D.pavement_median, ...BRIDGE_MIN];
  const tMin = Math.min(10, Math.floor(Math.min(...allT)/5)*5), tMax = Math.max(45, Math.ceil(Math.max(...allT)/5)*5 + 3), y = v => padT + (Hh-padT-padB)*(1-(v-tMin)/(tMax-tMin));
  const ys = v => (Hh-padB) - (Hh-padT-padB)*0.55*v/0.6, bw = (W-padL-padR)/H*0.8;
  let g = "";
  D.weather.forEach((w,i)=>{ if(w.snow>0) g+=`<rect x="${x(i)-bw/2}" y="${ys(w.snow)}" width="${bw}" height="${Hh-padB-ys(w.snow)}" fill="${css("--snow")}"/>`; });
  for (const [v,col] of [[32,css("--muted")],[15,css("--bad")]]) { if (v<tMin) continue;
    g+=`<line x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}" stroke="${col}" stroke-width="1" stroke-opacity=".6"/><text x="0" y="${y(v)+3}">${v}°F</text>`; }
  const path = (arr,col,wd,dash) => `<polyline fill="none" stroke="${col}" stroke-width="${wd}" ${dash?`stroke-dasharray="${dash}"`:""} points="${arr.map((v,i)=>`${x(i)},${y(v)}`).join(" ")}"/>`;
  g += path(D.weather.map(w=>w.air), css("--air"), 1.5, "4 3") + path(D.pavement_median, css("--grade"), 2) + path(BRIDGE_MIN, css("--bridge"), 2);
  D.hours.forEach((h,i)=>{ if (h.endsWith("T00:00")) g+=`<text x="${x(i)}" y="${Hh-4}" text-anchor="middle">${hr(i).toLocaleString("en-US",{weekday:"short"})}</text>`; });
  g += `<text x="${W-padR}" y="${padT+6}" text-anchor="end"><tspan style="fill:${css("--grade")}">road</tspan> · <tspan style="fill:${css("--bridge")}">coldest bridge</tspan> · air · <tspan style="fill:${css("--blue")}">snow</tspan></text>`;
  g += `<line x1="${x(t)}" x2="${x(t)}" y1="${padT}" y2="${Hh-padB}" stroke="${css("--ink")}" stroke-width="1.5"/>`;
  svgC.innerHTML = g;
  svgC.onclick = e => { const r=svgC.getBoundingClientRect(); setT(Math.round((e.clientX-r.left-padL)/(r.width-padL-padR)*(H-1))); };
}
const issueEl = document.getElementById("issue"), hospEl = document.getElementById("hosp");
if (LIVE) issueEl.add(new Option(`Next 24 h (from ${fmtT(0)})`, 0));
D.hours.forEach((h,i)=>{ if (/T(06|18):00$/.test(h) && i+24<=H && i>0) issueEl.add(new Option(`${LIVE ? "From" : "Plan issued"} ${fmtT(i)}`, i)); });
issueEl.value = [...issueEl.options].find(o=>D.hours[o.value].endsWith("01-05T18:00"))?.value ?? issueEl.options[0].value;
if (LIVE) { const first = D.strategies.advisor.events.find(e=>e[4]>0);
  if (first) { const o = [...issueEl.options].filter(o=>+o.value<=first[0] && first[0]<+o.value+24).pop(); if (o) issueEl.value = o.value; } }
hospEl.add(new Option("All hospitals","all"));
D.hospitals.forEach(h=>hospEl.add(new Option(SHORT[h.id],h.id)));
issueEl.onchange = hospEl.onchange = () => planTable();
function planTable(){
  const t0 = +issueEl.value, t1 = Math.min(H, t0+24), hf = hospEl.value, groups = new Map();
  for (let tt=t0; tt<t1; tt++) for (const e of EV.advisor.byT[tt]) {
    const s = SEG[e[1]]; if (hf!=="all" && s.hosp!==hf) continue;
    const pass = tt < D.onset ? "pre" : Math.floor((tt - D.onset - 1) / D.route_cycle_h), k = `${pass}|${e[2]}|${e[3]}`;
    if (!groups.has(k)) groups.set(k,{a:D.actions[e[2]], m:D.materials[e[3]], t0:tt, t1:tt, lm:0, lb:0, rmin:1e9, rmax:0, br:0});
    const g = groups.get(k); g.t0=Math.min(g.t0,tt); g.t1=Math.max(g.t1,tt); g.lm+=s.lane_mi; g.lb+=e[4]*s.lane_mi;
    if (e[4]>0){ g.rmin=Math.min(g.rmin,e[4]); g.rmax=Math.max(g.rmax,e[4]); } if (s.bridge) g.br++;
  }
  const rows = [...groups.values()].sort((a,b)=>a.t0-b.t0), tb = document.querySelector("#plantbl tbody");
  tb.innerHTML = rows.map(g=>`<tr data-t="${g.t0}" style="cursor:pointer"><td>${fmtT(g.t0).replace(/^\w+, /,"")}${g.t1>g.t0?`–${fmtH(g.t1+1)}`:""}</td>
    <td>${g.a}</td><td><span class="sw2" style="background:${css(matColor(g.m))}"></span>${g.m}</td>
    <td class="n">${g.lm.toFixed(1)}</td><td class="n">${g.rmax? (g.rmin===g.rmax? g.rmax : `${g.rmin}–${g.rmax}`) : "0"}</td><td class="n">${(g.lb/2000).toFixed(1)}</td></tr>`).join("") ||
    `<tr><td colspan="6" class="note">No treatment needed in this window.</td></tr>`;
  tb.querySelectorAll("tr[data-t]").forEach(r=>r.onclick=()=>setT(+r.dataset.t));
  const c = [];
  for (let tt=t0; tt<t1; tt++) if (D.hours[tt].endsWith("T07:00")) {
    const t1s = SEG.filter(s=>s.tier===1 && (hf==="all"||s.hosp===hf));
    const ok = t1s.filter(s=>D.strategies.advisor.risk[s.id][tt] !== "3").reduce((a,s)=>a+s.lane_mi,0), all = t1s.reduce((a,s)=>a+s.lane_mi,0);
    c.push(`7 AM shift change: ${Math.round(100*ok/all)}% of tier-1 ER approaches modeled ice-free.`);
  }
  c.push(`Total for this window: ${(rows.reduce((a,g)=>a+g.lb,0)/2000).toFixed(1)} t. Select a row to jump there.`);
  document.getElementById("callouts").innerHTML = c.map(x=>`<p class="note">${x}</p>`).join("");
}
function impact(){
  const A = D.strategies.advisor.totals, B = D.strategies.blanket.totals;
  if (LIVE) {
    document.getElementById("impact").innerHTML = `<div><div class="v">${A.salt_tons} t</div><div class="l">advisor salt, next ${H} h</div></div>
      <div><div class="v">${B.salt_tons} t</div><div class="l">blanket practice${B.applications?"":" (storms only)"}</div></div>`;
    document.getElementById("sens").textContent = "The Jan 2025 storm replay shows the full comparison."; return;
  }
  const saved = B.salt_tons - A.salt_tons, pct = Math.round(100*saved/B.salt_tons);
  document.getElementById("impact").innerHTML = `<div><div class="v">${pct}% less</div><div class="l">salt: ${A.salt_tons} t vs ${B.salt_tons} t for the storm</div></div>
    <div><div class="v">${A.icy_lane_mile_hours_tier1} / ${B.icy_lane_mile_hours_tier1}</div><div class="l">icy lane-mile-hours on tier-1 roads</div></div>
    <div><div class="v">~${(saved*0.607).toFixed(0)} t</div><div class="l">less chloride to Rock Creek / Anacostia</div></div>
    ${D.validation ? `<div><div class="v">ρ ${D.validation.spearman}</div><div class="l">satellite check of cold roads</div></div>` : `<div><div class="v">${A.cacl_tons} t</div><div class="l">CaCl₂ used</div></div>`}`;
  document.getElementById("sens").innerHTML = "Saving depends on the assumed blanket rate: " + D.sensitivity.map(s=>`${s.rate} lb → ${s.saving_pct}%`).join(" · ") + ".";
}
document.getElementById("method").innerHTML = `
${LIVE ? `<p><b>Forecast.</b> ${LIVE.office}, issued ${LIVE.issued ? new Date(LIVE.issued).toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "?"}, for each hospital's own 2.5 km grid cell (${LIVE.grids.length} cells).</p>`
      : `<p><b>Weather.</b> Recorded hourly weather for Jan 5–7, 2025 (ERA5 via Open-Meteo), replayed as if it were the forecast.</p>`}
<p><b>Pavement temperature</b> is modeled per road, not measured: weather plus each road's Google Earth Engine profile (elevation, terrain shadow, tree canopy, pavement, building height, water, satellite surface temperature).</p>
<p><b>Salt rules</b> follow the Minnesota Snow &amp; Ice Control Handbook bands, sized for the coldest hour ahead and counting residual salt.</p>
<p><b>Truck counts</b> are estimates; replace with DPW fleet data. Approval is a demo and dispatches nothing. Map snow shows when snow is falling, not storm direction.</p>
<p><a href="regression.html">Open the analytics: factor charts, what-if simulator, satellite regressions →</a></p>`;

// ---------- data source + refresh (local server only)
const src = document.getElementById("source");
if (LIVE) {
  const iss = LIVE.issued ? new Date(LIVE.issued).toLocaleString("en-US",{weekday:"short",hour:"numeric",minute:"2-digit"}) : "?";
  src.innerHTML = `${STATIC ? "Snapshot of the" : "Live"} NWS forecast issued ${iss}.` + (STATIC ? "" :
    ` <span class="row" style="margin-top:8px"><button class="btn-s" id="refresh">↻ Refresh forecast</button><button class="btn-s" id="drillBtn">Drill −25°F</button><span id="rmsg"></span></span>`)
    + (LIVE.drill_f ? `<div class="drill"><b>Drill, not a real forecast:</b> shifted ${LIVE.drill_f}°F colder.</div>` : "");
  const go = async drill => { const msg = document.getElementById("rmsg"); msg.textContent = "Fetching…";
    try { const r = await fetch(`/api/refresh?drill=${drill}`, {method:"POST"}); const j = await r.json(); if (!j.ok) throw new Error(j.error); location.reload(); }
    catch (e) { msg.textContent = (e instanceof TypeError || e instanceof SyntaxError) ? "Needs the demo server" : `NWS error: ${e.message}`; } };
  if (!STATIC) { document.getElementById("refresh").onclick = () => go(0); document.getElementById("drillBtn").onclick = () => go(25); }
  if (LIVE.drill_f) document.getElementById("chip").parentElement.insertAdjacentHTML("afterend", `<div class="note" style="position:relative;color:var(--amber);margin-top:6px">Drill: forecast shifted ${LIVE.drill_f}°F colder</div>`);
} else src.textContent = "Replay of recorded weather from the Jan 5–7, 2025 DC snowstorm.";

// ---------- time wiring
const slider = document.getElementById("slider"); slider.max = H-1;
function setT(v, animate){ t = Math.max(0, Math.min(H-1, v)); slider.value = t; renderAll(animate !== false); }
slider.oninput = () => setT(+slider.value);
let timer=null;
document.getElementById("play").onclick = e => { const b = e.currentTarget;
  if (timer){ clearInterval(timer); timer=null; b.textContent="▶"; return; }
  b.textContent="❚❚"; timer=setInterval(()=>{ if(t>=H-1){ clearInterval(timer); timer=null; b.textContent="▶"; } else setT(t+1); }, 900); };
addEventListener("resize", () => { sizeSnow(); if (drawer.classList.contains("open")) { drawTimeline(current); drawChart(); } });

const start = LIVE ? 0 : Math.max(0, D.hours.findIndex(h=>h.endsWith("01-05T18:00")));
planTable(); impact(); sizeSnow();
setT(start, true);
let framed = false;
new ResizeObserver(() => { const m=document.getElementById("map"); if (!m.clientWidth) return; map.invalidateSize(); if (!framed){ frame(); framed = true; } }).observe(document.getElementById("map"));
if (!REDUCED) snowFrame();
</script>
